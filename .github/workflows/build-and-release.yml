name: Build & Package Extension

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Package Chrome Extension
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Version from Manifest
        id: manifest
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Package Extension ZIP
        run: |
          mkdir -p dist/staging
          cp -r extension/* dist/staging/
          rm -f dist/staging/test-page.html
          cd dist/staging
          zip -r "../Bible-Hover-v${{ steps.manifest.outputs.version }}.zip" ./*
          cd ../..
          rm -rf dist/staging
          ls -la dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bible-Hover-v${{ steps.manifest.outputs.version }}
          path: dist/Bible-Hover-v${{ steps.manifest.outputs.version }}.zip

      - name: Publish GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Bible-Hover-v${{ steps.manifest.outputs.version }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
